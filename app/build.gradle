plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.hilt.android)
    alias(libs.plugins.ksp)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.jahi.pipelinetest'
    compileSdk 35

    def elevenLabKey = project.hasProperty('elevenLabKey') ? project.elevenLabKey : ""

    defaultConfig {
        applicationId "com.jahi.pipelinetest"
        minSdk 30
        targetSdk 35
        versionCode project.hasProperty('buildNumber') ? project.buildNumber.toInteger() : 1
        versionName "1.0"

        buildConfigField 'String', 'ELEVEN_LAB_KEY', "\"${elevenLabKey}\""
        
        // Gallery AI OAuth redirect scheme
        manifestPlaceholders = [appAuthRedirectScheme: "com.google.ai.edge.gallery.oauth"]

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += "-Xcontext-receivers"
    }
    
    
    buildFeatures {
        compose true
        buildConfig true
    }
}

hilt {
    enableAggregatingTask = false
}

dependencies {
    // Import the Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:33.14.0')

    // Firebase Analytics
    implementation 'com.google.firebase:firebase-analytics'

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.androidx.security.crypto
    implementation libs.androidx.compose.navigation
    implementation libs.kotlinx.serialization.json
    implementation libs.material.icon.extended
    implementation libs.androidx.work.runtime
    implementation libs.androidx.datastore.preferences
    implementation libs.com.google.code.gson
    implementation libs.androidx.splashscreen
    
    // Gallery AI dependencies
    implementation libs.mediapipe.tasks.text
    implementation libs.mediapipe.tasks.genai
    implementation libs.mediapipe.tasks.imagegen
    implementation libs.commonmark
    implementation libs.richtext
    implementation libs.tflite
    implementation libs.tflite.gpu
    implementation libs.tflite.support
    implementation libs.camerax.core
    implementation libs.camerax.camera2
    implementation libs.camerax.lifecycle
    implementation libs.camerax.view
    implementation libs.openid.appauth
    implementation libs.androidx.lifecycle.process
    
    // Logging
    implementation libs.timber
    
    // Room
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler
    
    // Hilt
    implementation libs.hilt.android
    implementation libs.androidx.hilt.navigation.compose
    ksp libs.hilt.compiler
    
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
}