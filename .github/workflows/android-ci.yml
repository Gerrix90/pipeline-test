name: Android CI with Firebase Distribution

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_distribute:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools-version: 34.0.0

    - name: Debug secrets availability
      run: |
        echo "Checking if secrets are available..."
        if [ -n "$GOOGLE_SERVICES_CONTENT" ]; then
          echo "✅ GOOGLE_SERVICES_JSON_CONTENT is available"
          echo "Content length: ${#GOOGLE_SERVICES_CONTENT} characters"
        else
          echo "❌ GOOGLE_SERVICES_JSON_CONTENT is NOT available"
        fi
        echo "Testing with updated secret content..."
      env:
        GOOGLE_SERVICES_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON_CONTENT }}

    - name: Create google-services.json
      run: |
        cat > app/google-services.json << 'EOF'
        ${{ secrets.GOOGLE_SERVICES_JSON_CONTENT }}
        EOF

    - name: Verify google-services.json created
      run: |
        if [ -f app/google-services.json ]; then
          echo "✅ google-services.json created successfully"
          echo "File size: $(stat -c%s app/google-services.json) bytes"
          echo "=== FULL FILE CONTENT ==="
          cat app/google-services.json
          echo "========================="
          echo "Checking for project_info:"
          grep -c "project_info" app/google-services.json || echo "❌ project_info not found"
          echo "JSON validation:"
          python3 -m json.tool app/google-services.json > /dev/null && echo "✅ Valid JSON" || echo "❌ Invalid JSON"
        else
          echo "❌ google-services.json not found"
          exit 1
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug -PbuildNumber=${{ github.run_number }}

    - name: Distribute Debug APK to Firebase App Distribution
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{ secrets.FIREBASE_APP_ID }}
        serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_JSON_CONTENT }}
        file: app/build/outputs/apk/debug/app-debug.apk
        groups: "android-testers"
        releaseNotes: "Debug build: ${{ github.event.head_commit.message }}"